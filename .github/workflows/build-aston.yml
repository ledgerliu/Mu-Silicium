name: Build UEFI for PJE110 (aston)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-aston.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # 不设 CI_BUILD=true：setup_env.sh 在 CI_BUILD=true 时会
      # apt full-upgrade -y，在 runner 上没有必要且会拖慢构建。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          bash ./setup_env.sh -p apt

      # build_uefi.py 用了 tomllib，需要 Python >= 3.11。
      # 用 venv 避开 Ubuntu 24.04 的 PEP 668 externally-managed-environment。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r pip-requirements.txt

      # -m 0 = DEVICE_MODEL 0 = "Ace 3" / PJE110 / 23801
      # -r DEBUG = 出调试日志，第一次启动要靠它拿 UART 输出
      - name: Build aston / model 0 / DEBUG
        run: |
          . .venv/bin/activate
          python build_uefi.py -d aston -m 0 -r DEBUG

      - name: Upload boot image
        uses: actions/upload-artifact@v7
        with:
          name: Mu-aston-0-DEBUG
          path: ./Mu-aston-0.img
          if-no-files-found: error
          compression-level: 9

      - name: Upload build directory on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aston-build-logs
          path: |
            Build/**/*.txt
            Build/**/*.log
          if-no-files-found: ignore
